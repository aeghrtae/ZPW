<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <title>Document</title>
    <style>

        body{
            background-color: rgb(210, 226, 236);
        }
            
           .showhide{
           
            display: flex;
            justify-content: center;
            gap: 25px;

           }
           .slideupdown{
            
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 25px;
           }

           .pclass{
             justify-content: center;
                text-align: center;
                font-size: 300%;
                margin-top: 200px;
            width: 100%;
            height:350% ;
            

           }
           .dobry{
            color: green;
           }
           .zly{
           color: red;
           }
          

           .wyjasnienie1{
            display: none;
           }
    </style>
        
    <script>

       $(function(){

             $("#hide").on("click",function(){
                 $("#hidep").hide();
        })


          $("#show").on("click",function(){
                 $("#hidep").show();
        })

        $("#toggle").on("click",function(){
                 $("#hidep").toggle();
        })



        $("#slideup").on("click",function(){
                 $("#hidep").slideUp();
        })

        $("#slideDown").on("click",function(){
                 $("#hidep").slideDown();
        })

         $("#slideToggle").on("click",function(){
                 $("#hidep").slideToggle();
        })


$("input[name='pyt1']").change(function(){
  let inpt =$("input[name='pyt1']");

    for(let i = 0; i < inpt.length; i++ ){
        let obecnyinpt = $(inpt[i]);
        let obecn = $(inpt[i]).attr('id');

        let label = $(`label[for="${obecn}"]`)

        label.removeClass("dobry zly");

        if(obecn === "odp3"){
            label.addClass("dobry");
        }else {
            label.addClass("zly");
        }

        obecnyinpt.prop('disabled',true);
        $(".wyjasnienie1").slideDown();
        
    }
    
        
        
        
        
    

})


       })
       



    </script>

    

</head>
<body>
    <div class="pclass">
        <p id="hidep">Hide me!</p>
    </div>
         

    <div class="showhide">
    <button id="hide">hide</button>
    <button id="show">show</button>
    <button id="toggle">toggle</button>
    </div>

    
  <div class="slideupdown">
    <button id="slideup">slideup</button>
    <button id="slideDown">slideDown</button>
    <button id="slideToggle">slideToggle</button>
  </div>


<div class="pytanie1">

<h1>Pytanie 1:</h1>
  <h2>A, B czy C</h2>
  <label for="odp1">A</label>
  <input type="radio" name="pyt1" id="odp1" >
  <br>
   <label for="odp2">B</label>
  <input type="radio" name="pyt1" id="odp2" >
   <br>
    <label for="odp3">C</label>
  <input type="radio" name="pyt1" id="odp3" >
  <p class="wyjasnienie1">
    Bo C jest ok XD
  </p>


</div>
  
    
    
  

</body>
</html>
