<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>


    <script>
        $(function(){
            let start = 0;
            //object Event


            // $(document).on("keydown keyup keypress", function(){
            //     $("#eventType").text(event.type);
            // })

            //  $(document).on("mousemove", function(){
            //     $("#pageX").text(event.pageX);
            //     $("#pageY").text(event.pageY);
            // })
            let  positionX = 0;
            let  positionY = 0;
            $(document).on("keydown", function(){
               
                 if(event.key === "a"){
                  
                  positionX = positionX - 10;

                   $("#kwadrat").css("margin-left", positionX + "px");
                 } 
                 
                  if(event.key === "d"){
                  
                  positionX = positionX + 10;

                   $("#kwadrat").css("margin-left", positionX + "px");
                 } 


                  if(event.key === "w"){
                  
                  positionX = positionX - 10;

                   $("#kwadrat").css("margin-top", positionX + "px");
                 } 
                 
                  if(event.key === "s"){
                  
                  positionX = positionX + 10;

                   $("#kwadrat").css("margin-top", positionX + "px");
                 } 
                 
             })
            
             $("#jablko").css({
                    "margin-left": Math.floor((Math.random() * 500) + 1 ) + "px",
                     "margin-top": Math.floor((Math.random() * 500) + 1 ) + "px"
             })

           
          })


    </script>

    

</head>
